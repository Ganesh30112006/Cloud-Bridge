name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production bundle contains no demo code
        run: |
          if grep -l "createDemoApi\|demo-conn-aws" dist/assets/*.js; then
            echo "Demo service found in the production bundle" >&2
            exit 1
          fi
      - name: Production build refuses demo mode
        run: |
          if VITE_DEMO_MODE=true npx vite build --outDir /tmp/should-not-exist; then
            echo "Production build accepted VITE_DEMO_MODE=true" >&2
            exit 1
          fi
